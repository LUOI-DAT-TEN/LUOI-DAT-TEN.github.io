<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tính tiền theo bàn</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fafafa; color: #222; max-width: 560px; margin: auto; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  button { font: inherit; font-size: 14px; padding: 6px 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
  button.on { background: #222; color: #fff; border-color: #222; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
  .name { display: flex; gap: 8px; align-items: baseline; }
  .price { color: #888; font-size: 13px; white-space: nowrap; }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button { width: 28px; height: 28px; padding: 0; }
  .qty span { min-width: 20px; text-align: center; }
  .total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 600; margin-top: 14px; }
</style>
</head>
<body>

<h1>Tính tiền theo bàn</h1>
<div class="tabs" id="tabs"></div>
<div id="menu"></div>
<div class="total"><span>Tổng</span><span id="total">0 đ</span></div>
<p>cần hỗ trợ lh <a href="zalo.me/84968877951">tại đây</a></p>
 
<script>
  const MENU = [
    { name: "chua ngọt", price: 00000 },
    { name: "hải phòng", price: 00000 },
    { name: "chay", price: 25000 },
    { name: "thịt", price: 30000 },
    { name: "trứng", price: 30000 },
    { name: "tôm thịt", price: 35000 },
    { name: "trứng thịt", price: 35000 },
    { name: "trứng tôm thịt", price: 40000 },
    { name: "trứng lạng sơn", price: 15000 },
    { name: "chả thêm", price: 5000 },
    { name: "nước sâm", price: 12000 },
    { name: "nước ngọt", price: 16000 },
    { name: "trà đá", price: 5000 },
    { name: "N/A", price: 5000 },
    { name: "N/A", price: 10000 }
  ];

  let tables = [{ items: {} }];
  let cur = 0;

  const fmt = n => n.toLocaleString("vi-VN") + " đ";

  function addTable() {
    tables.push({ items: {} });
    cur = tables.length - 1;
    render();
  }

  function select(i) { cur = i; render(); }

  function change(i, d) {
    const t = tables[cur];
    t.items[i] = Math.max(0, (t.items[i] || 0) + d);
    render();
  }

  function total(t) {
    return MENU.reduce((s, m, i) => s + (t.items[i] || 0) * m.price, 0);
  }

  function render() {
    const t = tables[cur];

    document.getElementById("tabs").innerHTML =
      tables.map((x, i) =>
        `<button class="${i === cur ? "on" : ""}" onclick="select(${i})">Bàn ${i + 1}</button>`
      ).join("") +
      `<button onclick="addTable()">+</button>`;

    document.getElementById("menu").innerHTML = MENU.map((m, i) => `
      <div class="row">
        <div class="name">
          <span>${m.name}</span>
          <span class="price">${fmt(m.price)}</span>
        </div>
        <div class="qty">
          <button onclick="change(${i}, -1)">−</button>
          <span>${t.items[i] || 0}</span>
          <button onclick="change(${i}, 1)">+</button>
        </div>
      </div>`).join("");

    document.getElementById("total").textContent = fmt(total(t));
  }

  render();
</script>
</body>
</html>
